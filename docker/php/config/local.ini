fastcgi_logging = Off

[opcache]
; Tells OPcache to check the source file for changes. THIS IS THE FIX.
opcache.validate_timestamps=1

; How often (in seconds) to check for changes. 0 = check on every request.
opcache.revalidate_freq=0

; Your existing settings (they are fine)
opcache.enable=1
opcache.memory_consumption=256
opcache.max_accelerated_files = 20000
opcache.jit_buffer_size=100M
opcache.jit=1235

; Increase memory limit for large Excel imports/exports
memory_limit = 2048M

post_max_size = 100M
upload_max_filesize = 100M
max_execution_time = 300